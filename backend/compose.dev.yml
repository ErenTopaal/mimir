name: avaxbench

services:
  postgres:
    image: postgres:18.0
    restart: always
    environment:
      - POSTGRES_PASSWORD=DO_NOT_USE_ME
      - POSTGRES_USER=avaxbench
      - POSTGRES_DB=avaxbench
    volumes:
      - ./.data/postgres:/var/lib/postgresql/
    networks:
      - db

  rabbitmq:
    image: 'rabbitmq:4.2-management-alpine'
    environment:
      RABBITMQ_DEFAULT_PASS: DO_NOT_USE_ME
      RABBITMQ_DEFAULT_USER: avaxbench
    volumes:
      - ./.data/rabbitmq:/var/lib/rabbitmq/
    networks:
      - db

  secretsvc:
    build:
      dockerfile: docker/backend/Dockerfile
      context: .
    image: avaxbench/backend:latest
    command: ["python", "-m", "secretsvc"]
    container_name: avaxbench-secretsvc
    ports:
      - "127.0.0.1:50081:8081"
    environment:
      - "SECRETSVC_HOST=0.0.0.0"
      - "SECRETSVC_PORT=8081"
      - "SECRETSVC_SECRETS_DIR=/app/.data/secrets"
      - "SECRETSVC_SECRETS_TOKEN_RO=${SECRETS_TOKEN_RO:-dev-secret}"
      - "SECRETSVC_SECRETS_TOKEN_WO=${SECRETS_TOKEN_WO:-dev-secret-wo}"
    env_file:
      - .env
    volumes:
      - ./.data/secrets:/app/.data/secrets
    networks:
      avaxbench-shared:
        aliases:
          - secretsvc

  resultsvc:
    build:
      dockerfile: docker/backend/Dockerfile
      context: .
    image: avaxbench/backend:latest
    command: ["python", "-m", "resultsvc"]
    container_name: avaxbench-resultsvc
    ports:
      - "127.0.0.1:50083:8083"
    environment:
      - "RESULTSVC_HOST=0.0.0.0"
      - "DATABASE_DSN=postgresql+asyncpg://avaxbench:DO_NOT_USE_ME@postgres:5432/avaxbench"
    env_file:
      - .env
    networks:
      db:
      avaxbench-shared:
        aliases:
          - resultsvc

  oai_proxy:
    profiles: ["proxy"]
    build:
      dockerfile: docker/backend/Dockerfile
      context: .
    image: avaxbench/backend:latest
    command: ["python", "-m", "oai_proxy"]
    container_name: avaxbench-oai-proxy
    ports:
      - "127.0.0.1:50084:8084"
    environment:
      - "OAI_PROXY_HOST=0.0.0.0"
      - "OAI_PROXY_PORT=8084"
      # Required only when running with profile "proxy"
      - "OAI_PROXY_AES_KEY=${OAI_PROXY_AES_KEY:-}"
    env_file:
      - .env
    networks:
      avaxbench-shared:
        aliases:
          - oai.loc

networks:
  db:
  avaxbench-shared:
    name: avaxbench-shared

